version: 2
updates:
  - package-ecosystem: pip
    directory: /host/python
    schedule:
      interval: weekly

    versioning-strategy: lockfile-only
  - package-ecosystem: pip
    directory: /tools/hil
    schedule:
      interval: weekly

    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
