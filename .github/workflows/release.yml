name: Release

on:
  push:
    tags:
      # Plain semver only (matches docs/releasing.md); reject v1.2.3-rc1 etc.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (for dry-run artifact naming)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  host-tools:
    name: Host tools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install -r host/python/requirements-dev.txt

      - name: Syntax-check Python tools
        run: |
          python3 -m py_compile \
            host/python/src/pico_uart_hid.py \
            tools/linux/serial_bridge_test.py \
            tools/linux/serial_stress_benchmark.py

      - name: Run host unit tests (C Unity + Python pytest)
        run: tools/linux/test-host.sh

      - name: Import hidapi and exercise HID CLI help
        run: |
          python3 -c "import hid; print('hidapi OK')"
          python3 host/python/src/pico_uart_hid.py --help
          python3 tools/linux/serial_bridge_test.py --help
          python3 tools/linux/serial_stress_benchmark.py --help

  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Refusing version '$VERSION' (expected plain MAJOR.MINOR.PATCH like 1.2.3)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved firmware version: $VERSION"

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Cache Pico SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pico-sdk
          key: pico-sdk-2.2.0-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/linux/setup-sdk-env.sh

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/linux/build.sh \
            --board "$BOARD" \
            --firmware-version "$VERSION"

      - name: Package board artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BOARD: ${{ matrix.board }}
        run: |
          set -eu
          SRC="build/firmware-${BOARD}"
          OUT="dist"
          mkdir -p "$OUT"
          for ext in uf2 elf bin hex; do
            cp "$SRC/pico_uart.$ext" "$OUT/pico_uart-v${VERSION}-${BOARD}.$ext"
          done
          strings "$SRC/pico_uart.bin" | grep -Fqx "${VERSION}"
          python3 -c "
          import pathlib, re, sys
          sys.path.insert(0, 'host/python/tests')
          from contract import firmware_usb_ids, usb_identity_needle_le
          version = sys.argv[2]
          data = pathlib.Path(sys.argv[1]).read_bytes()
          m = re.match(r'^([0-9]+)\\.([0-9]+)\\.([0-9]+)$', version)
          assert m, version
          major, minor = int(m.group(1)), int(m.group(2))
          assert 0 <= major <= 99 and 0 <= minor <= 99
          bcd = ((major // 10) << 12) | ((major % 10) << 8) | ((minor // 10) << 4) | (minor % 10)
          vid, pid = firmware_usb_ids(pathlib.Path('.'))
          needle = usb_identity_needle_le(vid, pid, bcd)
          assert needle in data, needle.hex()
          # HID status Report Count 0x3F (63) must remain in the descriptor.
          assert bytes([0x95, 0x3F]) in data, 'HID status Report Count 0x3F missing'
          print(f'USB {vid:#06x}:{pid:#06x} bcdDevice=0x{bcd:04x} OK')
          " "$SRC/pico_uart.bin" "$VERSION"
          (cd "$OUT" && sha256sum pico_uart-v${VERSION}-${BOARD}.* > "SHA256SUMS-${BOARD}.txt")
          ls -la "$OUT"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.board }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, host-tools]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # workflow_dispatch builds artifacts only; tag pushes create a draft release
    if: github.event_name == 'push'

    steps:
      - name: Download all board artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoUart ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Draft release — complete `docs/releasing.md` before publishing:
            - Confirm packaged artifact SHAs match the recorded HIL images on **both** pico and pico2
            - For non-lab releases, replace development USB IDs (must not ship the lab placeholder)
            - Attach or link a recorded HIL pass covering both boards
            - Promote from draft only after the promote checklist passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
