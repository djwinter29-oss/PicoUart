name: Release

on:
  push:
    tags:
      # GitHub Actions tag filters are glob patterns, not regex: '+' is a
      # literal character here, not a "one or more digits" quantifier, so
      # "v[0-9]+.[0-9]+.[0-9]+" only matches tags with literal '+' characters
      # (e.g. "v1+.2+.3+") and never matches a real tag like v1.2.3. Use '*'
      # to trigger reliably on any vMAJOR.MINOR.PATCH tag; the "Resolve
      # version" step below still rejects anything that isn't plain semver
      # and enforces the 0-99 major/minor release policy.
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Base tag in vMAJOR.MINOR.PATCH form, for example v1.2.3 (preflight does not create a tag)"
        required: true
        type: string

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"

jobs:
  host-validation:
    name: Host validation
    uses: ./.github/workflows/host-validation.yml

  build:
    name: Build (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: pico
            label: pico
          - board: pico2
            label: pico2

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_TAG" "$REF_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved firmware version: $VERSION"

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache Pico SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/firmware/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          LABEL: ${{ matrix.label }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          tools/firmware/build.sh --board "$BOARD" --build-dir "build/firmware-${LABEL}" --firmware-version "$VERSION"

      - name: Package board artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BOARD: ${{ matrix.board }}
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          SRC="build/firmware-${LABEL}"
          OUT="dist"
          mkdir -p "$OUT"
          for ext in uf2 elf bin hex; do
            cp "$SRC/pico_uart.$ext" "$OUT/pico_uart-v${VERSION}-${LABEL}.$ext"
          done
          python3 tools/release/verify-build.py --build-dir "$SRC" --board "$BOARD" --version "$VERSION"
          (cd "$OUT" && sha256sum pico_uart-v${VERSION}-${LABEL}.* > "SHA256SUMS-${LABEL}.txt")
          ls -la "$OUT"

      - name: Verify no SDK regulator auto-adjust in the real build
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          # Inspects this matrix leg's actual compile_commands.json, resolved
          # preprocessor defines, and linked ELF/object symbols (not a mock).
          # It does not execute Boot ROM or validate physical voltage,
          # thermal margins, or hardware stability; that remains an HIL gate.
          python3 -m pip install --quiet --require-hashes -r host/python/requirements-voltage-lock.txt
          PICO_UART_VOLTAGE_BUILD_DIRS="$PWD/build/firmware-${LABEL}" \
            python3 -m pytest -c pyproject.toml \
            tests/firmware/test_system_clock_voltage_policy.py -k real_sdk -o addopts='' -q

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  dotnet-packages:
    name: Publish .NET Packages
    needs: host-validation
    uses: ./.github/workflows/publish-dotnet.yml
    with:
      tag: ${{ inputs.tag || '' }}

  python-package:
    name: Package Python
    needs: host-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve host version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_TAG" "$REF_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build Python wheel
        env:
          PICO_UART_HOST_VERSION: ${{ steps.version.outputs.version }}
        run: python -m pip wheel --no-deps host/python --wheel-dir dist

      - name: Verify installed Python release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          python -m venv build/host-wheel-check
          build/host-wheel-check/bin/python -m pip install --require-hashes -r host/python/requirements-runtime-lock.txt
          build/host-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd build
          host-wheel-check/bin/python - <<'PY'
          from importlib.metadata import version
          import os
          from pico_uart.web.app import create_app
          expected = os.environ['VERSION']
          assert version('pico-uart') == expected
          page = create_app(object()).test_client().get('/')
          assert page.status_code == 200
          assert f'aria-label="Host application version">{expected}</span>'.encode() in page.data
          PY

      - name: Checksum Python wheel
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          dist = Path('dist')
          files = sorted(dist.glob('*.whl'))
          assert len(files) == 1, 'Expected exactly one Python wheel'
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files)
          (dist / 'SHA256SUMS-python.txt').write_text(checksums, encoding='utf-8')
          PY

      - name: Upload Python package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, host-validation, python-package, dotnet-packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    # workflow_dispatch builds artifacts only; tag pushes create a draft release
    if: github.event_name == 'push'

    steps:
      - name: Checkout release gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require successful PR checks
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 tools/release/require_release_checks.py --sha "$SOURCE_SHA"

      - name: Download all release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoUart ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Draft release — complete `docs/releasing.md` before publishing:
            - Confirm packaged artifact SHAs match the recorded HIL images on the rated **pico** (125 MHz) and **pico2** (150 MHz) builds
            - Optional overclock profiles are selected on-device through the persistent configuration sector and require exact-board HIL qualification
            - Some Pico 2 boards may not support 300 MHz reliably; the reduced 280 MHz target still requires exact-board HIL before any stability claim
            - This project publishes lab/test artifacts using the unallocated `cafe:4010` USB identity
            - Attach or link a recorded HIL pass covering both rated boards
            - Promote from draft only after the promote checklist passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
