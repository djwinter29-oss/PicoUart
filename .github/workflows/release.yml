name: Release

on:
  push:
    tags:
      # Plain semver only (matches docs/releasing.md); reject v1.2.3-rc1 etc.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (for dry-run artifact naming)"
        required: true
        type: string

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"

jobs:
  host-tools:
    name: Host tools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Syntax-check Python tools
        run: |
          python3 -m py_compile \
            host/python/src/pico_uart_hid.py \
            tools/serial_bridge_test.py \
            tools/serial_stress_benchmark.py \
            tools/run_functional_test.py \
            tools/run_performance_test.py \
            tools/run_hardware_test.py \
            tools/hardware_test_result.py \
            tools/hardware_test_health.py \
            tools/check-usb-identity.py \
            tools/verify-build.py

      - name: Run host unit tests (C Unity + Python pytest)
        run: tools/test-host.sh --sanitize

      - name: Static-analyze host-testable firmware headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --error-exitcode=1 --enable=warning --inline-suppr \
            -I firmware/src \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            firmware/src/uart/backend_policy.h \
            firmware/src/uart/control_pending.h \
            firmware/src/uart/dma_progress_math.h \
            firmware/src/uart/hw/baud_rate.h \
            firmware/src/uart/line_coding.c \
            firmware/src/uart/topology.c \
            firmware/src/uart/hw/dma_claim.c \
            firmware/src/uart/hw/driver.c \
            firmware/src/uart/hw/dma_claim_ops.c \
            firmware/src/uart/hw/dma_claim.h \
            firmware/src/uart/pio/resource_claim.c \
            firmware/src/uart/pio/driver.c \
            firmware/src/uart/pio/resource_claim_ops.c \
            firmware/src/uart/pio/resource_claim.h \
            firmware/src/uart/pio/txstall_wait.h \
            firmware/src/usb/cdc_soft_pending.h

      - name: Import hidapi and exercise HID CLI help
        run: |
          python3 -c "import hid; print('hidapi OK')"
          python3 host/python/src/pico_uart_hid.py --help
          python3 tools/serial_bridge_test.py --help
          python3 tools/serial_stress_benchmark.py --help

  host-python-minimum:
    name: Host Python (3.10 minimum)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host Python tests
        run: python -m pytest

  host-tools-windows:
    name: Host tools (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host C unit tests
        shell: bash
        run: |
          cmake -S firmware/tests -B build/host-tests
          cmake --build build/host-tests --config Release --parallel
          ctest --test-dir build/host-tests -C Release --output-on-failure

      - name: Run host Python tests
        run: python -m pytest

  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Refusing version '$VERSION' (expected plain MAJOR.MINOR.PATCH like 1.2.3)" >&2
            exit 1
          fi
          OLD_IFS=$IFS
          IFS=.
          set -- $VERSION
          IFS=$OLD_IFS
          if [ "$1" -gt 99 ] || [ "$2" -gt 99 ] || [ "$3" -gt 255 ]; then
            echo "Refusing version '$VERSION' (major/minor must be 0-99; patch must be 0-255)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved firmware version: $VERSION"

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Cache Pico SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/build.sh \
            --board "$BOARD" \
            --firmware-version "$VERSION"

      - name: Package board artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BOARD: ${{ matrix.board }}
        run: |
          set -eu
          SRC="build/firmware-${BOARD}"
          OUT="dist"
          mkdir -p "$OUT"
          for ext in uf2 elf bin hex; do
            cp "$SRC/pico_uart.$ext" "$OUT/pico_uart-v${VERSION}-${BOARD}.$ext"
          done
          python3 tools/verify-build.py --build-dir "$SRC" --board "$BOARD" --version "$VERSION"
          (cd "$OUT" && sha256sum pico_uart-v${VERSION}-${BOARD}.* > "SHA256SUMS-${BOARD}.txt")
          ls -la "$OUT"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.board }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, host-tools, host-python-minimum, host-tools-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # workflow_dispatch builds artifacts only; tag pushes create a draft release
    if: github.event_name == 'push'

    steps:
      - name: Download all board artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoUart ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Draft release — complete `docs/releasing.md` before publishing:
            - Confirm packaged artifact SHAs match the recorded HIL images on **both** pico and pico2
            - This project publishes lab/test artifacts using the unallocated `cafe:4010` USB identity
            - Attach or link a recorded HIL pass covering both boards
            - Promote from draft only after the promote checklist passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
