name: Release

on:
  push:
    tags:
      # GitHub Actions tag filters are glob patterns, not regex: '+' is a
      # literal character here, not a "one or more digits" quantifier, so
      # "v[0-9]+.[0-9]+.[0-9]+" only matches tags with literal '+' characters
      # (e.g. "v1+.2+.3+") and never matches a real tag like v1.2.3. Use '*'
      # to trigger reliably on any vMAJOR.MINOR.PATCH tag; the "Resolve
      # version" step below still rejects anything that isn't plain semver
      # and enforces the 0-99 major/minor release policy.
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (for dry-run artifact naming)"
        required: true
        type: string

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"

jobs:
  host-validation:
    name: Host validation
    uses: ./.github/workflows/host-validation.yml

  build:
    name: Build (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_VERSION" "$REF_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved firmware version: $VERSION"

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Cache Pico SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/firmware/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tools/firmware/build.sh \
            --board "$BOARD" \
            --firmware-version "$VERSION"

      - name: Package board artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BOARD: ${{ matrix.board }}
        run: |
          set -eu
          SRC="build/firmware-${BOARD}"
          OUT="dist"
          mkdir -p "$OUT"
          for ext in uf2 elf bin hex; do
            cp "$SRC/pico_uart.$ext" "$OUT/pico_uart-v${VERSION}-${BOARD}.$ext"
          done
          python3 tools/release/verify-build.py --build-dir "$SRC" --board "$BOARD" --version "$VERSION"
          (cd "$OUT" && sha256sum pico_uart-v${VERSION}-${BOARD}.* > "SHA256SUMS-${BOARD}.txt")
          ls -la "$OUT"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.board }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, host-validation]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # workflow_dispatch builds artifacts only; tag pushes create a draft release
    if: github.event_name == 'push'

    steps:
      - name: Download all board artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: PicoUart ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            Draft release — complete `docs/releasing.md` before publishing:
            - Confirm packaged artifact SHAs match the recorded HIL images on **both** pico and pico2
            - This project publishes lab/test artifacts using the unallocated `cafe:4010` USB identity
            - Attach or link a recorded HIL pass covering both boards
            - Promote from draft only after the promote checklist passes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
