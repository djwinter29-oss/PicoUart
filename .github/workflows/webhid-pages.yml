name: WebHID Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to deploy (for example v0.5.0)"
        required: false
        type: string
      test_publish:
        description: "Deploy the selected branch commit to the live Pages URL instead of a release tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: webhid-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package WebHID
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout release tooling
        if: github.event_name != 'workflow_dispatch' || !inputs.test_publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate published release
        if: github.event_name != 'workflow_dispatch' || !inputs.test_publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tools/release/resolve-release-version.sh push '' "$RELEASE_TAG"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true

      - name: Checkout WebHID
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_publish && github.sha || github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check WebHID
        run: |
          node --check host/webhid/js/view.mjs
          node --check host/webhid/js/app.mjs
          node --test host/webhid/tests/*.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload WebHID site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: host/webhid

  deploy:
    name: Deploy WebHID
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4