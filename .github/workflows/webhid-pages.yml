name: WebHID Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag to deploy (for example v0.5.0)"
        required: false
        type: string
      test_publish:
        description: "Deploy the selected branch commit to the live Pages URL instead of a release tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: webhid-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package WebHID
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout release tooling
        if: github.event_name != 'workflow_dispatch' || !inputs.test_publish
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate published release
        id: release
        if: github.event_name != 'workflow_dispatch' || !inputs.test_publish
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh push '' "$RELEASE_TAG")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true

      - name: Checkout WebHID
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.test_publish && github.sha || github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check WebHID
        run: |
          node --check host/webhid/js/view.mjs
          node --check host/webhid/js/app.mjs
          node --test host/webhid/tests/*.test.mjs

      - name: Stamp WebHID version
        env:
          HOST_VERSION: ${{ inputs.test_publish && '0.0.0-debug' || steps.release.outputs.version }}
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.HOST_VERSION;
          if (!/^\d+\.\d+\.\d+(?:-debug)?$/.test(version ?? '')) throw new Error('Invalid host version');
          const path = 'host/webhid/index.html';
          const html = readFileSync(path, 'utf8');
          const marker = 'aria-label="Host application version">0.0.0-debug</span>';
          if (!html.includes(marker)) throw new Error('Host version marker missing');
          writeFileSync(path, html.replace(marker, marker.replace('0.0.0-debug', version)));
          JS

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload WebHID site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: host/webhid

  deploy:
    name: Deploy WebHID
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1