name: Publish .NET Packages

on:
  workflow_call:
    inputs:
      release_build:
        description: "Preserve the validated release version when called by the release pipeline"
        required: false
        default: true
        type: boolean
      tag:
        description: "Base tag in vMAJOR.MINOR.PATCH form for preflight; tag builds resolve their tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Base tag in vMAJOR.MINOR.PATCH form, for example v1.2.3 (does not create a tag)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Publish .NET Packages (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve host version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          TEST_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_build }}
        run: |
          set -eu
          VERSION=$(tools/release/resolve-release-version.sh "$EVENT_NAME" "$INPUT_TAG" "$REF_NAME")
          if [ "$TEST_PUBLISH" = true ]; then
            VERSION="${VERSION}-test.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish standalone host
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish host/dotnet/PicoUart -c Release -r "$RID" --self-contained true \
            -p:Version="$VERSION" -o build/host-release

      - name: Check and archive standalone host
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import tempfile
          version, rid = os.environ['VERSION'], os.environ['RID']
          root = Path('build/host-release').resolve()
          assert f'PicoUart/{version}' in json.loads((root / 'PicoUart.deps.json').read_text())['libraries']
          dist = Path('dist')
          dist.mkdir(exist_ok=True)
          archive_format = 'zip' if rid.startswith('win-') else 'gztar'
          archive = shutil.make_archive(str(dist / f'pico_uart-host-v{version}-{rid}'), archive_format, root_dir=root)
          with tempfile.TemporaryDirectory() as directory:
              extracted = Path(directory)
              shutil.unpack_archive(archive, extracted)
              assert f'PicoUart/{version}' in json.loads((extracted / 'PicoUart.deps.json').read_text())['libraries']
              executable = extracted / ('PicoUart.exe' if rid.startswith('win-') else 'PicoUart')
              subprocess.run([str(executable), '--help'], cwd=extracted, check=True)
          files = sorted(path for path in dist.iterdir() if path.is_file())
          checksums = ''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in files)
          (dist / f'SHA256SUMS-host-{rid}.txt').write_text(checksums, encoding='utf-8')
          PY

      - name: Upload host packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-host-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error