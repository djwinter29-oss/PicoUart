name: PR Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"

jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Cache Pico SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/linux/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
        run: tools/linux/build.sh --board "$BOARD"

      - name: Verify build contract
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -eu
          python3 tools/linux/verify-build.py --build-dir "build/firmware-${BOARD}" --board "$BOARD"

      - name: Smoke-check stamped version / bcdDevice
        if: matrix.board == 'pico'
        run: |
          set -eu
          tools/linux/build.sh --board pico --firmware-version 1.2.3 --build-dir build/firmware-pico-stamp
          python3 tools/linux/verify-build.py \
            --build-dir build/firmware-pico-stamp \
            --board pico \
            --version 1.2.3

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pico_uart-${{ matrix.board }}
          path: |
            build/firmware-${{ matrix.board }}/pico_uart.uf2
            build/firmware-${{ matrix.board }}/pico_uart.elf
            build/firmware-${{ matrix.board }}/pico_uart.bin
            build/firmware-${{ matrix.board }}/pico_uart.hex
          if-no-files-found: error

  firmware-windows:
    name: Firmware wrapper (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Install Windows build tools
        shell: powershell
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
              choco install ninja --no-progress --yes
          }
          ninja --version

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Cache Pico SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        shell: powershell
        run: . .\tools\windows\setup-sdk-env.ps1 -SdkVersion $env:PICO_SDK_VERSION -SdkRevision $env:PICO_SDK_REVISION

      - name: Build and verify firmware targets
        shell: powershell
        run: |
          $generator = "Ninja"
          $objcopy = (Get-Command arm-none-eabi-objcopy -ErrorAction Stop).Source
          .\tools\windows\build.ps1 -Board pico -Generator $generator
          python tools/linux/verify-build.py --build-dir build/firmware-pico --board pico --objcopy $objcopy
          $secondBuild = .\tools\windows\build.ps1 -Board pico -Generator $generator 2>&1
          $secondBuild | Write-Host
          if ($secondBuild -match "Build configuration changed") {
              throw "An identical Windows build unexpectedly reset CMake state."
          }
          .\tools\windows\build.ps1 -Board pico2 -Generator $generator
          python tools/linux/verify-build.py --build-dir build/firmware-pico2 --board pico2 --objcopy $objcopy

  host-tools:
    name: Host tools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Syntax-check Python tools
        run: |
          python3 -m py_compile \
            host/python/src/pico_uart_hid.py \
            tools/linux/serial_bridge_test.py \
            tools/linux/serial_stress_benchmark.py \
            tools/linux/run_functional_test.py \
            tools/linux/run_performance_test.py \
            tools/linux/run_hardware_test.py \
            tools/linux/hardware_test_result.py \
            tools/linux/hardware_test_health.py \
            tools/linux/check-usb-identity.py \
            tools/linux/verify-build.py

      - name: Run host unit tests (C Unity + Python pytest)
        run: tools/linux/test-host.sh --sanitize

      - name: Static-analyze host-testable firmware headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          cppcheck --error-exitcode=1 --enable=warning --inline-suppr \
            -I firmware/src \
            --suppress=missingIncludeSystem \
            --suppress=missingInclude \
            firmware/src/uart/backend_policy.h \
            firmware/src/uart/control_pending.h \
            firmware/src/uart/dma_progress_math.h \
            firmware/src/uart/hw/baud_rate.h \
            firmware/src/uart/line_coding.c \
            firmware/src/uart/topology.c \
            firmware/src/uart/hw/dma_claim.c \
            firmware/src/uart/hw/driver.c \
            firmware/src/uart/hw/dma_claim_ops.c \
            firmware/src/uart/hw/dma_claim.h \
            firmware/src/uart/pio/resource_claim.c \
            firmware/src/uart/pio/driver.c \
            firmware/src/uart/pio/resource_claim_ops.c \
            firmware/src/uart/pio/resource_claim.h \
            firmware/src/uart/pio/txstall_wait.h \
            firmware/src/usb/cdc_soft_pending.h

      - name: Import hidapi and exercise HID CLI help
        run: |
          python3 -c "import hid; print('hidapi OK')"
          python3 host/python/src/pico_uart_hid.py --help
          python3 tools/linux/serial_bridge_test.py --help
          python3 tools/linux/serial_stress_benchmark.py --help

  host-python-minimum:
    name: Host Python (3.10 minimum)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host Python tests
        run: python -m pytest

  host-tools-windows:
    name: Host tools (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host C unit tests
        run: |
          cmake -S firmware/tests -B build/host-tests
          cmake --build build/host-tests --config Release --parallel
          ctest --test-dir build/host-tests -C Release --output-on-failure

      - name: Run host Python tests
        run: python -m pytest
