name: PR Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"

jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Cache Pico SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/firmware/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
        run: tools/firmware/build.sh --board "$BOARD"

      - name: Verify build contract
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -eu
          python3 tools/release/verify-build.py --build-dir "build/firmware-${BOARD}" --board "$BOARD"

      - name: Smoke-check stamped version / bcdDevice
        if: matrix.board == 'pico'
        run: |
          set -eu
          tools/firmware/build.sh --board pico --firmware-version 1.2.3 --build-dir build/firmware-pico-stamp
          python3 tools/release/verify-build.py \
            --build-dir build/firmware-pico-stamp \
            --board pico \
            --version 1.2.3

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pico_uart-${{ matrix.board }}
          path: |
            build/firmware-${{ matrix.board }}/pico_uart.uf2
            build/firmware-${{ matrix.board }}/pico_uart.elf
            build/firmware-${{ matrix.board }}/pico_uart.bin
            build/firmware-${{ matrix.board }}/pico_uart.hex
          if-no-files-found: error

  host-validation:
    name: Host validation
    uses: ./.github/workflows/host-validation.yml
