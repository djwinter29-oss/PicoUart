name: PR Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PICO_SDK_VERSION: "2.3.0"
  PICO_SDK_REVISION: "98a542c1a62fb549ffb5d66a3e5892b06276b670"

jobs:
  firmware:
    name: Firmware (${{ matrix.label }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rated clocks stay the default build path (no clock override).
          - board: pico
            clock_khz: "125000"
            overclock: "false"
            label: pico
          - board: pico2
            clock_khz: "150000"
            overclock: "false"
            label: pico2
          # Development overclock images. CMake rejects these clocks unless
          # --unsafe-overclock is passed. Artifact names use label so they
          # do not collide with the rated pico / pico2 uploads.
          - board: pico
            clock_khz: "250000"
            overclock: "true"
            label: pico-250mhz
          - board: pico2
            clock_khz: "300000"
            overclock: "true"
            label: pico2-300mhz

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache Pico SDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .pico-sdk
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_REVISION }}-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/firmware/setup-sdk-env.sh \
            --sdk-version "$PICO_SDK_VERSION" \
            --sdk-revision "$PICO_SDK_REVISION"

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          LABEL: ${{ matrix.label }}
          CLOCK_KHZ: ${{ matrix.clock_khz }}
          OVERCLOCK: ${{ matrix.overclock }}
        run: |
          set -eu
          set -- --board "$BOARD" --build-dir "build/firmware-${LABEL}"
          if [ "$OVERCLOCK" = "true" ]; then
            set -- "$@" --system-clock-khz "$CLOCK_KHZ" --unsafe-overclock
          fi
          tools/firmware/build.sh "$@"

      - name: Verify build contract
        env:
          BOARD: ${{ matrix.board }}
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          python3 tools/release/verify-build.py --build-dir "build/firmware-${LABEL}" --board "$BOARD"

      - name: Verify no SDK regulator auto-adjust in the real build
        env:
          LABEL: ${{ matrix.label }}
        run: |
          set -eu
          # Inspects this matrix leg's actual compile_commands.json, resolved
          # preprocessor defines, and linked ELF/object symbols (not a mock).
          # It does not execute Boot ROM or validate physical voltage,
          # thermal margins, or hardware stability; that remains an HIL gate.
          python3 -m pip install --quiet pytest
          PICO_UART_VOLTAGE_BUILD_DIRS="$PWD/build/firmware-${LABEL}" \
            python3 -m pytest -c host/python/pyproject.toml \
            host/python/tests/test_system_clock_voltage_policy.py -k real_sdk -o addopts='' -q

      - name: Smoke-check stamped version / bcdDevice
        if: matrix.label == 'pico'
        run: |
          set -eu
          tools/firmware/build.sh --board pico --firmware-version 1.2.3 --build-dir build/firmware-pico-stamp
          python3 tools/release/verify-build.py \
            --build-dir build/firmware-pico-stamp \
            --board pico \
            --version 1.2.3

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pico_uart-${{ matrix.label }}
          path: |
            build/firmware-${{ matrix.label }}/pico_uart.uf2
            build/firmware-${{ matrix.label }}/pico_uart.elf
            build/firmware-${{ matrix.label }}/pico_uart.bin
            build/firmware-${{ matrix.label }}/pico_uart.hex
          if-no-files-found: error

  host-validation:
    name: Host validation
    uses: ./.github/workflows/host-validation.yml
