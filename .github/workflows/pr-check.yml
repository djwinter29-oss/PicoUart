name: PR Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico, pico2]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++

      - name: Install Arm GNU Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@98c40e51546516419841748d3210c290df0d2c6c # v1
        with:
          release: "13.3.Rel1"

      - name: Cache Pico SDK
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .pico-sdk
          key: pico-sdk-2.2.0-${{ runner.os }}

      - name: Setup Pico SDK
        run: |
          set --
          . tools/linux/setup-sdk-env.sh

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
        run: tools/linux/build.sh --board "$BOARD"

      - name: Smoke-check product identity
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -eu
          BIN="build/firmware-${BOARD}/pico_uart.bin"
          ELF="build/firmware-${BOARD}/pico_uart.elf"
          test -f "$BIN"
          test -f "$ELF"
          test -f "build/firmware-${BOARD}/pico_uart.uf2"
          file "$ELF" | grep -q "ARM"
          python3 -c "
          import pathlib, sys
          sys.path.insert(0, 'host/python/tests')
          from contract import firmware_usb_ids, usb_identity_needle_le
          data = pathlib.Path(sys.argv[1]).read_bytes()
          vid, pid = firmware_usb_ids(pathlib.Path('.'))
          needle = usb_identity_needle_le(vid, pid, 0)
          assert needle in data, needle.hex()
          assert bytes([0x95, 0x3F]) in data, 'HID status Report Count 0x3F missing'
          print(f'USB {vid:#06x}:{pid:#06x} bcdDevice=0x0000 OK')
          " "$BIN"
          strings "$BIN" | grep -qx "CDC0"
          strings "$BIN" | grep -qx "CDC5"
          strings "$BIN" | grep -Fqx "PicoUart USB CDC + HID"
          # Default CMake version stamp when --firmware-version is not passed
          strings "$BIN" | grep -Fqx "0.0.0-dev"

      - name: Smoke-check stamped version / bcdDevice
        if: matrix.board == 'pico'
        run: |
          set -eu
          tools/linux/build.sh --board pico --firmware-version 1.2.3 --build-dir build/firmware-pico-stamp
          BIN=build/firmware-pico-stamp/pico_uart.bin
          strings "$BIN" | grep -Fqx "1.2.3"
          python3 -c "
          import pathlib, sys
          sys.path.insert(0, 'host/python/tests')
          from contract import firmware_usb_ids, usb_identity_needle_le
          data = pathlib.Path(sys.argv[1]).read_bytes()
          vid, pid = firmware_usb_ids(pathlib.Path('.'))
          needle = usb_identity_needle_le(vid, pid, 0x0102)
          assert needle in data, needle.hex()
          print('stamped bcdDevice 0x0102 OK')
          " "$BIN"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pico_uart-${{ matrix.board }}
          path: |
            build/firmware-${{ matrix.board }}/pico_uart.uf2
            build/firmware-${{ matrix.board }}/pico_uart.elf
            build/firmware-${{ matrix.board }}/pico_uart.bin
            build/firmware-${{ matrix.board }}/pico_uart.hex
          if-no-files-found: error

  host-tools:
    name: Host tools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install -r host/python/requirements-dev.txt

      - name: Syntax-check Python tools
        run: |
          python3 -m py_compile \
            host/python/src/pico_uart_hid.py \
            tools/linux/serial_bridge_test.py \
            tools/linux/serial_stress_benchmark.py

      - name: Run host unit tests (C Unity + Python pytest)
        run: tools/linux/test-host.sh

      - name: Import hidapi and exercise HID CLI help
        run: |
          python3 -c "import hid; print('hidapi OK')"
          python3 host/python/src/pico_uart_hid.py --help
          python3 tools/linux/serial_bridge_test.py --help
          python3 tools/linux/serial_stress_benchmark.py --help
