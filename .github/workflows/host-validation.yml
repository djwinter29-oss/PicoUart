name: Host Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host-webhid:
    name: Host WebHID
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Check WebHID page and client
        run: |
          node --check host/webhid/js/view.mjs
          node --check host/webhid/js/app.mjs
          node --test host/webhid/tests/*.test.mjs

  host-dotnet:
    name: Host .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run .NET unit tests
        run: dotnet test host/dotnet/PicoUart.sln --filter "Category=Unit"

      - name: Check published host and shared UI contract
        run: python -m pytest tests/tooling/test_dotnet_host.py host/python/tests/test_web_app.py

  host-tools:
    name: Host tools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Syntax-check Python tools
        run: tools/validation/syntax-check-python.sh

      - name: Syntax-check shell tools
        run: tools/validation/syntax-check-shell.sh

      - name: Run host unit tests
        run: tools/validation/run-host-tests.sh --sanitize

      - name: Static-analyze host-testable firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          tools/validation/static-analyze.sh

      - name: Smoke-test host tools
        run: tools/validation/smoke-host-tools.sh

  host-python-minimum:
    name: Host Python (3.10 minimum)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host Python tests
        run: python -m pytest -c pyproject.toml

  host-tools-windows:
    name: Host tools (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host tests
        shell: bash
        run: |
          choco install ninja --no-progress -y 2>&1 | tail -3
          tools/validation/run-host-tests.sh
