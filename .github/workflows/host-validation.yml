name: Host Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host-tools:
    name: Host tools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Syntax-check Python tools
        run: tools/test/syntax-check-python.sh

      - name: Syntax-check shell tools
        run: tools/test/syntax-check-shell.sh

      - name: Run host unit tests
        run: tools/test/test-host.sh --sanitize

      - name: Static-analyze host-testable firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          tools/test/static-analyze.sh

      - name: Smoke-test host tools
        run: tools/test/smoke-host-tools.sh

  host-python-minimum:
    name: Host Python (3.10 minimum)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host Python tests
        run: python -m pytest -c host/python/pyproject.toml

  host-tools-windows:
    name: Host tools (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host tests
        shell: bash
        run: |
          choco install ninja --no-progress -y 2>&1 | tail -3
          tools/test/test-host.sh
