name: Host Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host-webhid:
    name: Host Direct Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Setup Python for browser smoke test
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Chromium browser test
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Check Direct Dashboard page and client
        run: |
          node --check host/direct/src/js/view.mjs
          node --check host/direct/src/js/app.mjs
          node --test host/direct/tests/*.test.mjs host/web/tests/*.test.mjs
          python host/direct/tests/browser_smoke.py

  host-apps:
    name: Host Python + .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install --group host/python/pyproject.toml:dev host/python

      - name: Run .NET unit tests
        run: dotnet test host/dotnet/PicoUart.sln -c Release --filter "Category=Unit"

      - name: Verify .NET formatting
        run: dotnet format host/dotnet/PicoUart.sln --verify-no-changes --no-restore

      - name: Run Python tests and published host contracts
        run: python -m pytest -c pyproject.toml

      - name: Run Windows native C tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja --no-progress -y
          tools/validation/run-host-tests.sh --skip-python

      - name: Run macOS native C tests
        if: runner.os == 'macOS'
        run: |
          if ! command -v cmake >/dev/null 2>&1; then brew install cmake; fi
          tools/validation/run-host-tests.sh --skip-python

  host-wheel-smoke:
    name: Host wheel smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build wheel, install it in a clean venv, and run it
        run: |
          python -m pip install build
          mkdir -p host/python/src/pico_uart/dashboard/assets
          cp -R host/web/src/. host/python/src/pico_uart/dashboard/assets/
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" host/python
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$(ls "$RUNNER_TEMP"/dist/*.whl)[dashboard]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/pico-uart" --help
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          from pico_uart.dashboard.app import create_app

          client = create_app().test_client()
          assert client.get("/").status_code == 200
          assert client.get("/favicon.svg").status_code == 200
          assert client.get("/css/dashboard.css").status_code == 200
          assert client.get("/js/dashboard.js").status_code == 200
          PY

  host-tools:
    name: Host tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install --group host/python/pyproject.toml:dev host/python

      - name: Syntax-check Python tools
        run: tools/validation/syntax-check-python.sh

      - name: Lint and type-check Python host
        working-directory: host/python
        run: |
          python -m ruff check src tests
          python -m mypy
          python -m pytest --cov=pico_uart --cov-fail-under=92

      - name: Syntax-check shell tools
        run: tools/validation/syntax-check-shell.sh

      - name: Run Linux native C tests with ASan/UBSan
        run: tools/validation/run-host-tests.sh --sanitize --skip-python

      - name: Static-analyze host-testable firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          tools/validation/static-analyze.sh

      - name: Smoke-test host tools
        run: tools/validation/smoke-host-tools.sh

  host-python-minimum:
    name: Host Python (3.10 minimum)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install host dependencies
        run: python -m pip install --group host/python/pyproject.toml:dev host/python

      - name: Run host Python tests
        run: python -m pytest -c pyproject.toml
