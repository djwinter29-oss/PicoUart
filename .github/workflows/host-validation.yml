name: Host Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  host-webhid:
    name: Host WebHID
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check WebHID page and client
        run: |
          node --check host/webhid/js/view.mjs
          node --check host/webhid/js/app.mjs
          node --test host/webhid/tests/*.test.mjs

  host-apps:
    name: Host Python + .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run .NET unit tests
        run: dotnet test host/dotnet/PicoUart.sln --filter "Category=Unit"

      - name: Run Python tests and published host contracts
        run: python -m pytest -c pyproject.toml

      - name: Run Windows native C tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install ninja --no-progress -y
          tools/validation/run-host-tests.sh --skip-python

  host-tools:
    name: Host tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install host dependencies
        run: python3 -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Syntax-check Python tools
        run: tools/validation/syntax-check-python.sh

      - name: Syntax-check shell tools
        run: tools/validation/syntax-check-shell.sh

      - name: Run Linux native C tests with ASan/UBSan
        run: tools/validation/run-host-tests.sh --sanitize --skip-python

      - name: Static-analyze host-testable firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cppcheck
          tools/validation/static-analyze.sh

      - name: Smoke-test host tools
        run: tools/validation/smoke-host-tools.sh

  host-python-minimum:
    name: Host Python (3.10 minimum)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r host/python/requirements-lock.txt

      - name: Run host Python tests
        run: python -m pytest -c pyproject.toml
