[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-uart"
version = "0.1.0"
description = "Host HID API, CLI, and Flask diagnostics dashboard for PicoUart"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["flask==3.1.2", "hidapi==0.14.0"]

[project.scripts]
pico-uart = "pico_uart.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pico_uart*"]
namespaces = false

[tool.setuptools.package-data]
"pico_uart.web" = ["assets/index.html", "assets/*.svg", "assets/css/*.css", "assets/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
python_files = ["test_*.py"]
addopts = "-q"