[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[project]
name = "pico-uart"
dynamic = ["version"]
description = "Host HID API, CLI, and optional Flask diagnostics dashboard for PicoUart"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Ji Dong"}]
keywords = ["uart", "raspberry-pi-pico", "hid", "diagnostics", "test-automation"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = ["hidapi==0.14.0.post4"]

[project.optional-dependencies]
dashboard = ["flask==3.1.3"]

[project.urls]
Homepage = "https://github.com/djwinter29-oss/PicoUart"
Documentation = "https://github.com/djwinter29-oss/PicoUart/blob/main/host/python/README.md"
Source = "https://github.com/djwinter29-oss/PicoUart"
Issues = "https://github.com/djwinter29-oss/PicoUart/issues"
Releases = "https://github.com/djwinter29-oss/PicoUart/releases"

[project.scripts]
pico-uart = "pico_uart.main:main"

[dependency-groups]
test = ["pytest==9.1.1"]
dev = [
	{include-group = "test"},
	"flask==3.1.3",
	"pytest-cov==6.2.1",
	"mypy==2.4.1",
	"ruff==0.17.3",
	"hatchling==1.32.4",
	"hatch-vcs==0.5.0",
	"editables==0.5",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback-version = "0.0.0.dev0"

[tool.hatch.version.raw-options]
root = "../.."
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*.[0-9]*.[0-9]*"

[tool.hatch.build]
artifacts = ["src/pico_uart/dashboard/assets/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/pico_uart"]

[tool.hatch.build.targets.sdist]
include = ["/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = [
	"src/pico_uart/hid/types.py",
	"src/pico_uart/hid/protocol.py",
	"src/pico_uart/hid/client.py",
	"src/pico_uart/hid/transport.py",
	"src/pico_uart/dashboard/app.py",
	"src/pico_uart/dashboard/boards.py",
	"src/pico_uart/dashboard/monitor.py",
	"src/pico_uart/dashboard/types.py",
	"src/pico_uart/main.py",
]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "pico_uart.dashboard.app"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pico_uart.dashboard.boards"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pico_uart.dashboard.monitor"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pico_uart.dashboard.types"
disallow_untyped_defs = true