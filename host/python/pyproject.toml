[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pico-uart"
dynamic = ["version"]
description = "Host HID API, CLI, and Flask diagnostics dashboard for PicoUart"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Ji Dong"}]
keywords = ["uart", "raspberry-pi-pico", "hid", "diagnostics", "test-automation"]
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = ["flask==3.1.2", "hidapi==0.14.0.post4"]

[project.urls]
Homepage = "https://github.com/djwinter29-oss/PicoUart"
Documentation = "https://github.com/djwinter29-oss/PicoUart/blob/main/host/python/README.md"
Source = "https://github.com/djwinter29-oss/PicoUart"
Issues = "https://github.com/djwinter29-oss/PicoUart/issues"
Releases = "https://github.com/djwinter29-oss/PicoUart/releases"

[project.scripts]
pico-uart = "pico_uart.cli:main"

[tool.hatch.version]
source = "code"
path = "hatch_build.py"
expression = "get_version()"

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/pico_uart"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/hatch_build.py", "/requirements*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
python_files = ["test_*.py"]
addopts = "-q"