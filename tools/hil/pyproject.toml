[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pico-uart-hil"
version = "0.1.0"
description = "Reusable functional and performance HIL tools for PicoUart"
requires-python = ">=3.10"
dependencies = ["pico-uart", "pyserial==3.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
pico-uart-hil = "hil_test_suite.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hil_test_suite*"]
namespaces = false

[tool.uv.sources]
pico-uart = { path = "../../host/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-q"
